button{font:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap;justify-content:space-between}
.ttl{flex:1;min-width:220px;text-align:center;background:linear-gradient(#fff6d8,#f0d48e);border:3px solid var(--gold);border-radius:14px;padding:4px 12px;box-shadow:0 4px 12px #0005}
.ttl b{font-size:clamp(20px,4vw,38px);display:block}.ttl i{font-size:clamp(12px,2vw,18px)}
.pill{background:#123a73;color:#fff;border:2px solid var(--gold);border-radius:20px;padding:6px 12px;font-weight:700}
#game{display:none;max-width:1300px;margin:0 auto;grid-template-columns:1fr 1fr;gap:14px;padding:8px 14px}
.left{position:relative;display:flex;justify-content:center;align-items:center;min-height:380px}
#owl{position:absolute;left:0;top:0;width:30%;max-width:170px;z-index:2;border:3px solid #d9a21b;border-radius:18px;box-shadow:0 4px 14px #0007}
#say{position:absolute;right:0;top:0;max-width:44%;background:#fffbe9;border:2px solid var(--gold);border-radius:18px;padding:8px 12px;font-size:clamp(12px,1.7vw,16px);text-align:center;z-index:3;box-shadow:0 3px 8px #0004}
.wh{position:relative;width:min(88%,500px);aspect-ratio:1;margin-top:40px;margin-left:16%}
.rim{position:absolute;inset:0;border-radius:50%;background:radial-gradient(#fff3b0 0,var(--gold) 60%,#8a5d00);box-shadow:0 0 28px #ffd54f,0 8px 20px #0006;padding:4%}
.rim svg{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}
.ptr{position:absolute;left:50%;top:-4%;transform:translateX(-50%);font-size:clamp(28px,6vw,46px);z-index:4;color:#d62828;filter:drop-shadow(0 2px 2px #0008)}
#spin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:27%;aspect-ratio:1;border-radius:50%;border:4px solid #fff3b0;background:radial-gradient(#ffe27a,#e0a100);font-weight:700;font-size:clamp(12px,2.4vw,20px);color:#4b2a00;z-index:5;box-shadow:0 0 16px #fff6;animation:pul 1.6s infinite}
#spin:disabled{animation:none;filter:grayscale(.6);cursor:default}
@keyframes pul{50%{transform:translate(-50%,-50%) scale(1.07)}}
#card{background:linear-gradient(#fff9e4,var(--par));border:5px double var(--gold);border-radius:22px;padding:14px;box-shadow:0 0 0 3px #fff3b0 inset,0 8px 24px #0006;display:flex;flex-direction:column;gap:10px;justify-content:center;text-align:center;min-height:380px}
.who{font-size:clamp(18px,3vw,26px);font-weight:700;color:#a3151b}
.cat{display:inline-block;color:#fff;border-radius:14px;padding:3px 14px;font-weight:700;align-self:center}
.pic{font-size:clamp(54px,11vw,96px);background:linear-gradient(#bfe3ff,#e9f7d2);border-radius:18px;border:3px solid var(--gold);padding:6px;line-height:1.15;letter-spacing:4px}
.q{font-size:clamp(20px,3.2vw,32px);font-weight:700}.pr{font-size:clamp(15px,2.2vw,20px)}
.hint{background:#e6f4d8;border-radius:12px;padding:8px;border:2px dashed #3a8a2a;font-weight:700}
.btn{border:3px solid #fff3b0;border-radius:30px;padding:10px 22px;font-weight:700;font-size:clamp(16px,2.6vw,22px);color:#fff;background:linear-gradient(#3fb04f,#1f7a2c);box-shadow:0 4px 10px #0005}
.btn.b{background:linear-gradient(#4a8df0,#1e50b0)}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.gr button{padding:10px 6px;border-radius:14px;border:3px solid #fff3b0;color:#fff;font-weight:700;font-size:15px}
.cats{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.ch{border:3px solid var(--gold);border-radius:14px;padding:6px 4px;text-align:center;font-weight:700;font-size:clamp(11px,1.6vw,17px);opacity:.75;transition:.3s;background:#fff8}
.ch span{display:block;font-size:clamp(20px,3.5vw,34px)}.ch.on{opacity:1;transform:translateY(-6px) scale(1.06);box-shadow:0 0 18px #ffd54f}
.sb{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sb span{background:#fff8dc;border:2px solid var(--gold);border-radius:14px;padding:2px 10px;font-weight:700;font-size:14px}
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#0008}
.box{background:linear-gradient(#fff9e4,var(--par));border:5px double var(--gold);border-radius:22px;padding:20px;max-width:560px;width:92%;max-height:92vh;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:10px}
.box input,.box textarea{font:inherit;padding:8px;border:2px solid var(--gold);border-radius:10px;width:100%;background:#fff}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(28px,6vw,54px);font-weight:700;color:#fff;text-shadow:0 3px 8px #000}
.st{position:fixed;animation:up 1.8s forwards;font-size:34px}
@keyframes up{from{transform:translateY(0) scale(.3);opacity:1}to{transform:translateY(-70vh) scale(1.5) rotate(200deg);opacity:0}}
.cf{position:fixed;top:-20px;width:10px;height:14px;animation:fall linear forwards;z-index:25}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#chick{width:200px;display:block;margin:0 auto;animation:dance .4s infinite alternate ease-in-out}
@keyframes dance{from{transform:translateY(0) rotate(-10deg)}to{transform:translateY(-30px) rotate(12deg) scale(1.06)}}
.wing{transform-origin:50px 90px;animation:fl .25s infinite alternate}@keyframes fl{to{transform:rotate(-35deg)}}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #d9a21b88}
@media(max-width:800px){.wh{margin-left:0;margin-top:90px}#owl{width:26%}#game{grid-template-columns:1fr}.cats{grid-template-columns:repeat(3,1fr)}.left{min-height:330px}}

function snd(f,d,t,v,w){if(!on)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+(w||0);o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.12,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}catch(e){}}
function music(){clearInterval(mi);const n=[262,330,392,440,392,330,294,392];let k=0;mi=setInterval(()=>{if(on){snd(n[k++%8],1.2,'sine',.025)}},700)}

(function(){let h='';CATS.forEach((c,i)=>{const R=96,p=a=>[100+R*Math.cos((a-90)*Math.PI/180),100+R*Math.sin((a-90)*Math.PI/180)],a=p(i*60),b=p(i*60+60),m=i*60+30,tx=100+62*Math.cos((m-90)*Math.PI/180),ty=100+62*Math.sin((m-90)*Math.PI/180);

// setup
function setup(){$('#start').style.display='flex';const sv=load();
$('#sbx').innerHTML=`<h2 style="margin:0">📚 Волшебная библиотека</h2><p>Выберите режим игры. Каждый ученик (или команда) получает ровно 3 задания. За ответ — до 20 баллов, значит, максимум 60. Отвечаем вслух.</p><button class="btn" id="m1">👤 Индивидуальная игра</button><button class="btn b" id="m2">👥 Командная игра</button>${sv&&sv.tot&&sv.n<sv.tot?'<button class="btn" style="background:#b8860b" id="m3">▶ Продолжить сохранённую игру</button>':''}`;
$('#m1').onclick=()=>{$('#sbx').innerHTML=`<h3 style="margin:0">Имена учеников</h3><textarea id="nm" rows="6" placeholder="Каждое имя с новой строки или через запятую"></textarea><button class="btn" id="go">Начать игру ▶</button>`;$('#go').onclick=()=>{const p=$('#nm').value.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);if(!p.length){$('#nm').style.borderColor='red';$('#nm').placeholder='Добавьте хотя бы одно имя!';return}begin('i',p)}};
$('#m2').onclick=()=>{$('#sbx').innerHTML=`<h3 style="margin:0">Названия команд</h3><input id="t1" value="Команда «Совята»"><input id="t2" value="Команда «Грамотеи»"><button class="btn" id="go">Начать игру ▶</button>`;$('#go').onclick=()=>begin('t',[$('#t1').value.trim()||'Команда 1',$('#t2').value.trim()||'Команда 2'])};
if(sv&&sv.tot&&sv.n<sv.tot)$('#m3').onclick=()=>{G=sv;begin()}}
function begin(mode,names){if(mode)G={mode,n:0,tot:names.length*3,cnt:names.map(()=>3),turn:0,last:-1,used:[[],[],[],[],[],[]],cur:null,P:names.map(n=>({n,s:0,st:0}))};

function stat(){const s=G.P.reduce((a,p)=>a+p.s,0),t=G.P.reduce((a,p)=>a+p.st,0);$('#tot').textContent=`⭐ ${t} · ${s} б.`;$('#sb').innerHTML=G.P.map(p=>`<span>${p.n}: ${p.s} б. ⭐${p.st}</span>`).join('')}

<div style="font-weight:700">Всего: ⭐${G.P.reduce((a,p)=>a+p.st,0)} · ${G.P.reduce((a,p)=>a+p.s,0)} баллов</div>
<div id="chw" style="display:none"><video id="vid" playsinline controls loop style="width:100%;border-radius:14px;border:3px solid #d9a21b"></video></div>
<button class="btn" id="again">↺ Играть снова</button>`;$('#fin').style.display='flex';$('#again').onclick=reset;
for(let i=0;i<70;i++){const s=document.createElement('div');s.className='cf';s.style.left=Math.random()*100+'%';s.style.background=['#ffd54f','#f06aa8','#4fb3f0','#3fb04f','#9b4fd6'][i%5];s.style.animationDuration=2+Math.random()*3+'s';s.style.animationDelay=Math.random()*2+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),7000)}
